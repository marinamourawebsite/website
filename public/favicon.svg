<?xml version="1.0" encoding="UTF-8"?>
<!--
  Marina Moura monogram favicon (SPEC §5).
  Hand-authored: bg-colored rounded square + stacked serif "M / M".
  Hex values mirror the design tokens in src/styles/global.css (source of truth):
    #f5f2ed = --color-bg    (background)
    #2e2e2c = --color-ink   (border, letters, rule)
  A favicon SVG is outside Tailwind, so token hexes are inlined here by necessity.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Marina Moura">
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="#f5f2ed" stroke="#2e2e2c" stroke-width="2"/>
  <g fill="#2e2e2c" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-weight="600" text-anchor="middle">
    <text x="32" y="30" font-size="24">M</text>
    <text x="32" y="55" font-size="24">M</text>
  </g>
  <line x1="22" y1="34" x2="42" y2="34" stroke="#2e2e2c" stroke-width="1.5"/>
</svg>
